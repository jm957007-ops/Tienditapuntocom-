<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1426"><title>Tiendita punto com Altamira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1426;--ink2:#1c2b4d;--gold:#c8a24a;--gold2:#ecd08a;--bg:#f4f1e9;--card:#fff;--tx:#141a26;--mu:#6b7280;--bd:#e7e2d4;--bad:#c0392b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
.hero{background:radial-gradient(120% 140% at 85% 0%,#2b4580 0%,var(--ink) 62%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 56px;border-radius:0 0 30px 30px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto}
.logo{font-weight:800;font-size:1.2rem;letter-spacing:.2px}.logo b{color:var(--gold2)}
.loc{font-size:.62rem;letter-spacing:2px;border:1px solid var(--gold);color:var(--gold2);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.pill{border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.1);padding:8px 15px;border-radius:999px;font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit}
.hh{max-width:980px;margin:26px auto 0}
.hh h1{margin:0 0 8px;font-size:1.85rem;line-height:1.12;font-weight:800}
.hh p{margin:0;color:#c9d3ea;max-width:480px}
.w{max-width:980px;margin:-34px auto 0;padding:0 14px calc(40px + env(safe-area-inset-bottom,0px))}
.svcs{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.svcs{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(3,1fr)!important}.hh h1{font-size:2.4rem}}
.svc{background:var(--card);border-radius:22px;box-shadow:0 14px 34px rgba(11,20,38,.16);overflow:hidden;border:1px solid var(--bd)}
.ph{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ph::-webkit-scrollbar{display:none}
.s{flex:0 0 100%;scroll-snap-align:center;height:200px;position:relative;background:var(--ink2)}
.s img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;color:#fff;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.empty{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3.6rem;background:linear-gradient(135deg,var(--ink2),var(--ink));color:var(--gold2)}
.empty small{font-size:.75rem;opacity:.7;margin-top:4px}
.bd{padding:14px 16px 16px}
.bd h2{margin:0;font-size:1.1rem}.bd p{margin:2px 0 0;color:var(--mu);font-size:.88rem}
h2{font-size:1.15rem;margin:0 0 10px}
.st{margin:28px 0 10px;display:flex;align-items:baseline;gap:8px}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;font-size:.98rem;border-radius:12px;cursor:pointer;font-family:inherit}
.btn.p{background:linear-gradient(135deg,var(--gold),var(--gold2));border:0;color:#1a1405;box-shadow:0 6px 16px rgba(200,162,74,.35)}
.btn.sm{padding:8px;margin-top:6px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.5}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font-size:1rem;font-family:inherit}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px;font-weight:600}
.search{margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:#fff;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--tx);font-family:inherit}
.chip.on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.vc{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 4px 14px rgba(11,20,38,.06)}
.av{width:60px;height:60px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(135deg,var(--ink2),var(--ink));color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 0 0 3px #f1e3b5}
.vc b{display:block;font-size:.95rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;color:#7a5d12;background:#f6ecc9;border-radius:999px;padding:3px 9px;margin-top:4px}
.pc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.pe{font-size:2rem}.pn{font-weight:600;font-size:.9rem}.pr{font-weight:800;color:#8a6a14;font-size:1.05rem}
.note{font-size:.78rem;color:var(--mu)}
.err{background:#fdecea;color:#8a1f12;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.85rem}
.modal{position:fixed;inset:0;background:rgba(8,14,28,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.x{float:right;background:#f1efe8;border:0;width:34px;height:34px;border-radius:50%;font-size:1.3rem;color:var(--tx);cursor:pointer}
.tot{font-size:1.7rem;font-weight:800;color:#8a6a14;margin:12px 0 2px}
.stat{background:linear-gradient(135deg,var(--ink2),var(--ink));color:#fff;border-radius:18px;padding:16px}
.stat b{font-size:2.6rem;color:var(--gold2);line-height:1}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--gold)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cats div{background:#f7f4ea;border-radius:12px;padding:8px 10px;font-size:.85rem;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:10px 4px;border-radius:11px;border:1px solid var(--bd);background:#fff;font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit}.tabs .on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.thumb{width:64px;height:48px;border-radius:8px;object-fit:cover}
footer{text-align:center;color:var(--mu);font-size:.78rem;margin-top:34px}
footer a{color:var(--mu)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script></head>
<body><div id="root"><p style="text-align:center;padding:60px;font-family:sans-serif">Cargando…</p></div>
<script type="text/babel" data-type="module">
import React,{useEffect,useState} from 'https://esm.sh/react@18.3.1';
import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,collection,doc,onSnapshot,query,limit,writeBatch,increment,getDoc,setDoc,deleteDoc,updateDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const fbApp=initializeApp({"apiKey": "AIzaSyA8U1VqvFHKci1l7mFsGTh99FWm2jzCXL8", "authDomain": "tienditapuntocom.firebaseapp.com", "projectId": "tienditapuntocom", "storageBucket": "tienditapuntocom.firebasestorage.app", "messagingSenderId": "355799983790", "appId": "1:355799983790:web:055c1be4fc00f41b9b2f3f"});
const db=getFirestore(fbApp),auth=getAuth(fbApp),WA='528335329332';

const MAXV=500,MAXP=10
const CATS=[['servicios','Servicios','🛠️'],['comida','Comida','🍽️'],['juguetes','Juguetes','🧸'],['ropa','Ropa','👗'],['abarrotes','Abarrotes','🛒'],['hogar','Artículos del hogar','🏠'],['autos','Autos y motos','🚗']]
const catOf=k=>CATS.find(c=>c[0]===k)
const SEC={sillas:{t:'Renta de sillas y mesas Altamira',s:'Mobiliario para tus eventos',e:'🪑',b:'Cotizar renta'},fletes:{t:'Fletes económicos',s:'Mudanzas y cargas en la zona conurbada',e:'🚚',b:'Cotizar flete'}}
const wa=(num,m)=>window.open(`https://wa.me/${num}?text=${encodeURIComponent(m)}`,'_blank')
const err=e=>(e&&e.code)||'error'
const genPin=()=>String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000)
function fileToData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function Modal({title,onClose,children}){
 return <div className="modal on" onClick={e=>e.target===e.currentTarget&&onClose()}>
  <div className="sheet"><button className="x" onClick={onClose}>×</button><h2 style={{marginTop:0}}>{title}</h2>{children}</div></div>
}

function Sillas({onClose}){
 const [s,setS]=useState(20),[m,setM]=useState(3),[d,setD]=useState(1),[en,setEn]=useState(0),[f,setF]=useState('')
 const tot=(s*5+m*40)*Math.max(1,d)+en
 return <Modal title="Cotizar sillas y mesas" onClose={onClose}>
  <label>Sillas</label><input type="number" min="0" value={s} onChange={e=>setS(+e.target.value)}/>
  <label>Mesas</label><input type="number" min="0" value={m} onChange={e=>setM(+e.target.value)}/>
  <label>Días de renta</label><input type="number" min="1" value={d} onChange={e=>setD(+e.target.value)}/>
  <label>Entrega</label><select value={en} onChange={e=>setEn(+e.target.value)}><option value={0}>Yo recojo</option><option value={100}>Entrega en Altamira</option><option value={180}>Entrega Tampico/Madero</option></select>
  <label>Fecha del evento</label><input type="date" value={f} onChange={e=>setF(e.target.value)}/>
  <div className="tot">Total estimado: ${tot}</div><div className="note">Precios de ejemplo: silla $5, mesa $40 por día.</div>
  <button className="btn p" onClick={()=>wa(WA,`Hola, quiero cotizar renta:\n${s} sillas, ${m} mesas, ${d} día(s)\nFecha: ${f||'por definir'}\nEstimado: $${tot}`)}>Enviar por WhatsApp</button>
 </Modal>
}

function Fletes({onClose}){
 const [o,setO]=useState(''),[de,setDe]=useState(''),[z,setZ]=useState(250),[v,setV]=useState(1),[ay,setAy]=useState(0),[q,setQ]=useState('')
 const tot=Math.round(z*v+ay)
 return <Modal title="Cotizar flete económico" onClose={onClose}>
  <label>Origen</label><input value={o} onChange={e=>setO(e.target.value)} placeholder="Colonia / dirección"/>
  <label>Destino</label><input value={de} onChange={e=>setDe(e.target.value)} placeholder="Colonia / dirección"/>
  <label>Zona</label><select value={z} onChange={e=>setZ(+e.target.value)}><option value={250}>Dentro de Altamira</option><option value={380}>Altamira ↔ Tampico/Madero</option><option value={550}>Fuera de la zona conurbada</option></select>
  <label>Vehículo</label><select value={v} onChange={e=>setV(+e.target.value)}><option value={1}>Camioneta pickup</option><option value={1.6}>Camión 3.5 ton</option></select>
  <label>Ayudante de carga</label><select value={ay} onChange={e=>setAy(+e.target.value)}><option value={0}>No</option><option value={150}>Sí (+$150)</option></select>
  <label>Qué vas a mover</label><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Ej. sala, refri, cajas"/>
  <div className="tot">Total estimado: ${tot}</div><div className="note">Estimado, el precio final se confirma por WhatsApp.</div>
  <button className="btn p" onClick={()=>wa(WA,`Hola, quiero cotizar un flete:\nOrigen: ${o}\nDestino: ${de}\nVehículo: ${v===1?'Pickup':'Camión 3.5 ton'}\nAyudante: ${ay?'Sí':'No'}\nCarga: ${q}\nEstimado: $${tot}`)}>Enviar por WhatsApp</button>
 </Modal>
}


function Puesto({v,onClose}){
 const c=catOf(v.cat)
 return <Modal title={v.name} onClose={onClose}>
  {c&&<span className="tag">{c[2]} {c[1]}</span>}
  <div className="grid" style={{marginTop:12}}>
   {v.products.map((p,k)=><div className="pc" key={k}><div className="pe">{p.e||'📦'}</div><div className="pn">{p.n}</div><div className="pr">${p.p}</div>
    <button className="btn p sm" onClick={()=>wa('52'+v.phone,`Hola ${v.name}, vi tu puesto en Tiendita punto com Altamira y quiero: ${p.n} ($${p.p})`)}>Pedir</button></div>)}
  </div>
  {!v.products.length&&<div className="note" style={{marginTop:12}}>Este puesto aún no tiene productos.</div>}
 </Modal>
}

function VendorLogin({uid,onDone,onClose}){
 const [phone,setPhone]=useState(''),[pin,setPin]=useState(''),[msg,setMsg]=useState('')
 async function enter(){
  const ph=phone.replace(/\D/g,'')
  if(ph.length!==10||pin.trim().length<4)return setMsg('Escribe tu teléfono de 10 dígitos y tu PIN.')
  try{await setDoc(doc(db,'sessions',uid),{phone:ph,pin:pin.trim()});onDone(ph)}catch(e){setMsg('Teléfono o PIN incorrecto ('+err(e)+').')}
 }
 return <Modal title="Entrar a mi puesto" onClose={onClose}>
  <label>Teléfono registrado (10 dígitos)</label><input inputMode="numeric" maxLength={10} value={phone} onChange={e=>setPhone(e.target.value)}/>
  <label>PIN</label><input type="password" inputMode="numeric" maxLength={8} value={pin} onChange={e=>setPin(e.target.value)}/>
  <button className="btn p" onClick={enter}>Entrar</button>
  <div className="note" style={{marginTop:8}}>{msg||'Tu PIN te lo da el administrador.'}</div>
 </Modal>
}

function MiPuesto({v,uid,onClose,onExit}){
 const [name,setName]=useState(v.name),[cat,setCat]=useState(v.cat||'comida'),[rows,setRows]=useState(v.products.length?v.products:[{e:'',n:'',p:''}]),[msg,setMsg]=useState('')
 const upd=(i,k,val)=>setRows(r=>r.map((x,j)=>j===i?{...x,[k]:val}:x))
 async function save(){
  const products=rows.filter(r=>String(r.n).trim()).slice(0,MAXP).map(r=>({e:String(r.e).trim(),n:String(r.n).trim(),p:+r.p||0}))
  if(!name.trim())return setMsg('Pon el nombre de tu puesto.')
  try{await updateDoc(doc(db,'vendors',v.id),{name:name.trim(),cat,products});onClose()}catch(e){setMsg('No se pudo guardar ('+err(e)+').')}
 }
 return <Modal title="Mi puesto" onClose={onClose}>
  <label>Nombre del puesto</label><input maxLength={40} value={name} onChange={e=>setName(e.target.value)}/>
  <label>Categoría</label><select value={cat} onChange={e=>setCat(e.target.value)}>{CATS.map(c=><option key={c[0]} value={c[0]}>{c[2]} {c[1]}</option>)}</select>
  <label>Productos (máx. {MAXP}): emoji, nombre y precio</label>
  {rows.map((r,i)=><div key={i} style={{display:'flex',gap:6,marginBottom:6}}>
   <input style={{width:56}} maxLength={2} placeholder="🧴" value={r.e} onChange={e=>upd(i,'e',e.target.value)}/>
   <input maxLength={40} placeholder="Producto" value={r.n} onChange={e=>upd(i,'n',e.target.value)}/>
   <input type="number" min="0" style={{width:88}} placeholder="$" value={r.p} onChange={e=>upd(i,'p',e.target.value)}/>
   <button className="x" onClick={()=>setRows(rows.filter((_,j)=>j!==i))}>×</button></div>)}
  {rows.length<MAXP&&<button className="btn" onClick={()=>setRows([...rows,{e:'',n:'',p:''}])}>+ Agregar producto</button>}
  <button className="btn p" onClick={save}>Guardar puesto</button>
  <button className="btn" onClick={async()=>{try{await deleteDoc(doc(db,'sessions',uid))}catch(e){};onExit()}}>Cerrar sesión</button>
  <div className="note" style={{marginTop:8}}>{msg}</div>
 </Modal>
}

function Admin({uid,isAdmin,setIsAdmin,V,P,onClose}){
 const [code,setCode]=useState(''),[msg,setMsg]=useState(''),[tab,setTab]=useState('res')
 const [n,setN]=useState(''),[t,setT]=useState(''),[cat,setCat]=useState('comida'),[pin,setPin]=useState(genPin()),[pins,setPins]=useState({})
 const [sec,setSec]=useState('sillas'),[ttl,setTtl]=useState(''),[busy,setBusy]=useState(false)
 useEffect(()=>{if(!isAdmin)return;return onSnapshot(collection(db,'pins'),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data().pin);setPins(o)},e=>setMsg('No se pueden leer los PIN ('+err(e)+')'))},[isAdmin])
 async function enter(){setMsg('');try{await setDoc(doc(db,'admins',uid),{code:code.trim()});setIsAdmin(true)}catch(e){setMsg('Código incorrecto ('+err(e)+').')}}
 async function add(){
  const ph=t.replace(/\D/g,'')
  if(!n.trim()||ph.length!==10||pin.trim().length<4)return setMsg('Pon nombre, teléfono de 10 dígitos y PIN (mínimo 4).')
  if(V.some(v=>v.id===ph))return setMsg('Ese teléfono ya está registrado.')
  if(V.length>=MAXV)return setMsg(`Límite de ${MAXV} vendedores.`)
  const b=writeBatch(db);b.set(doc(db,'vendors',ph),{name:n.trim(),phone:ph,cat,products:[]});b.set(doc(db,'pins',ph),{pin:pin.trim()});b.set(doc(db,'meta','counter'),{count:increment(1)},{merge:true})
  try{await b.commit();setN('');setT('');setPin(genPin());setMsg(`Agregado. PIN de ${ph}: ${pin.trim()}`)}catch(e){setMsg('No se pudo agregar ('+err(e)+').')}
 }
 async function del(v){
  if(!confirm(`¿Quitar a "${v.name}"?`))return
  const b=writeBatch(db);b.delete(doc(db,'vendors',v.id));b.delete(doc(db,'pins',v.id));b.set(doc(db,'meta','counter'),{count:increment(-1)},{merge:true})
  try{await b.commit()}catch(e){setMsg('No se pudo quitar ('+err(e)+').')}
 }
 async function newPin(v){const p=genPin();try{await setDoc(doc(db,'pins',v.id),{pin:p});setMsg(`Nuevo PIN de ${v.name}: ${p}`)}catch(e){setMsg('No se pudo cambiar el PIN ('+err(e)+').')}}
 async function addPhoto(e){
  const f=e.target.files[0];e.target.value='';if(!f)return
  if(P.filter(p=>p.sec===sec).length>=8)return setMsg('Máximo 8 fotos por sección.')
  setBusy(true)
  try{const img=await fileToData(f);if(img.length>650000)throw {code:'imagen-muy-grande'}
   await setDoc(doc(collection(db,'promos')),{sec,title:ttl.trim().slice(0,60),img,ts:Date.now()});setTtl('');setMsg('Foto publicada.')}
  catch(x){setMsg('No se pudo subir la foto ('+err(x)+').')}
  setBusy(false)
 }
 async function delPhoto(p){if(!confirm('¿Quitar esta foto?'))return;try{await deleteDoc(doc(db,'promos',p.id))}catch(e){setMsg('No se pudo quitar ('+err(e)+').')}}
 async function exit(){try{await deleteDoc(doc(db,'admins',uid))}catch(e){};setIsAdmin(false);onClose()}
 if(!isAdmin)return <Modal title="Administrador" onClose={onClose}>
  <label>Código de administrador</label><input type="password" value={code} onChange={e=>setCode(e.target.value)}/>
  <button className="btn p" onClick={enter}>Entrar</button><div className="note" style={{marginTop:8}}>{msg}</div></Modal>
 return <Modal title="Panel de administrador" onClose={onClose}>
  <div className="tabs">{[['res','Resumen'],['ven','Vendedores'],['pro','Promociones']].map(a=><button key={a[0]} className={tab===a[0]?'on':''} onClick={()=>{setTab(a[0]);setMsg('')}}>{a[1]}</button>)}</div>
  {tab==='res'&&<>
   <div className="stat"><div>Vendedores en el sistema</div><b>{V.length}</b> <span>de {MAXV}</span>
    <div className="bar"><i style={{width:Math.min(100,V.length/MAXV*100)+'%'}}/></div></div>
   <div className="cats">{CATS.map(c=><div key={c[0]}><span>{c[2]} {c[1]}</span><b>{V.filter(v=>v.cat===c[0]).length}</b></div>)}</div>
   <div className="note" style={{marginTop:10}}>Fotos de promociones publicadas: {P.length}</div></>}
  {tab==='ven'&&<>
   <label>Nombre del vendedor</label><input maxLength={40} value={n} onChange={e=>setN(e.target.value)}/>
   <label>Teléfono (10 dígitos)</label><input inputMode="numeric" maxLength={10} value={t} onChange={e=>setT(e.target.value)}/>
   <label>Categoría</label><select value={cat} onChange={e=>setCat(e.target.value)}>{CATS.map(c=><option key={c[0]} value={c[0]}>{c[2]} {c[1]}</option>)}</select>
   <label>PIN (lo puedes cambiar)</label><input inputMode="numeric" maxLength={8} value={pin} onChange={e=>setPin(e.target.value)}/>
   <button className="btn p" onClick={add}>Agregar vendedor</button>
   <div style={{marginTop:10}}>{V.map(v=><div className="row" key={v.id}>
    <div style={{flex:1}}><b>{v.name}</b><div className="note">{v.phone} · PIN {pins[v.id]||'—'} · {(catOf(v.cat)||[])[1]||'Sin categoría'}</div></div>
    <button className="btn sm" style={{margin:0,width:'auto',padding:'6px 10px'}} onClick={()=>newPin(v)}>PIN</button>
    <button className="btn sm" style={{margin:0,width:'auto',padding:'6px 10px',borderColor:'#c0392b',color:'#c0392b'}} onClick={()=>del(v)}>Quitar</button></div>)}
    {!V.length&&<div className="note">No hay vendedores.</div>}</div></>}
  {tab==='pro'&&<>
   <label>Sección</label><select value={sec} onChange={e=>setSec(e.target.value)}><option value="sillas">Renta de sillas y mesas</option><option value="fletes">Fletes económicos</option></select>
   <label>Texto de la foto (promoción, opcional)</label><input maxLength={60} value={ttl} onChange={e=>setTtl(e.target.value)} placeholder="Ej. 20% de descuento este mes"/>
   <label className="btn p" style={{textAlign:'center',cursor:'pointer',margin:'12px 0 0',color:'#1a1405',fontSize:'.98rem'}}>{busy?'Subiendo…':'+ Elegir y publicar foto'}<input type="file" accept="image/*" onChange={addPhoto} disabled={busy} style={{display:'none'}}/></label>
   <div style={{marginTop:10}}>{P.map(p=><div className="row" key={p.id}><img className="thumb" src={p.img}/><div style={{flex:1}}><b>{SEC[p.sec].t}</b><div className="note">{p.title||'Sin texto'}</div></div>
    <button className="btn sm" style={{margin:0,width:'auto',padding:'6px 10px',borderColor:'#c0392b',color:'#c0392b'}} onClick={()=>delPhoto(p)}>Quitar</button></div>)}
    {!P.length&&<div className="note">Aún no hay fotos.</div>}</div></>}
  <div className="note" style={{marginTop:10,fontWeight:700,color:'#8a1f12'}}>{msg}</div>
  <button className="btn" onClick={exit}>Salir del modo administrador</button>
 </Modal>
}

function App(){
 const [user,setUser]=useState(null),[vid,setVid]=useState(null),[V,setV]=useState([]),[P,setP]=useState([]),[q,setQ]=useState(''),[cat,setCat]=useState('todos'),[modal,setModal]=useState(null),[sel,setSel]=useState(null),[isAdmin,setIsAdmin]=useState(false),[authErr,setAuthErr]=useState('')
 useEffect(()=>onAuthStateChanged(auth,u=>u?setUser(u):signInAnonymously(auth).catch(e=>setAuthErr(err(e)))),[])
 const uid=user?.uid
 useEffect(()=>{setIsAdmin(false);if(uid){getDoc(doc(db,'admins',uid)).then(d=>setIsAdmin(d.exists())).catch(()=>{});getDoc(doc(db,'sessions',uid)).then(d=>setVid(d.exists()?d.data().phone:null)).catch(()=>{})}},[uid])
 useEffect(()=>onSnapshot(query(collection(db,'vendors'),limit(MAXV)),s=>setV(s.docs.map(d=>({id:d.id,...d.data(),products:d.data().products||[]}))),e=>setAuthErr(err(e))),[])
 useEffect(()=>onSnapshot(query(collection(db,'promos'),limit(40)),s=>setP(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0))),()=>{}),[])
 const mine=V.find(v=>v.id===vid)
 const need=()=>{if(!uid){alert('Aún no hay conexión con la base de datos'+(authErr?' ('+authErr+')':'')+'. Espera un momento y reintenta.');return false}return true}
 const L=V.filter(v=>(cat==='todos'||v.cat===cat)&&(!q||v.name.toLowerCase().includes(q.toLowerCase())||v.products.some(p=>p.n.toLowerCase().includes(q.toLowerCase()))))
 return <>
  <div className="hero"><div className="top"><div className="logo">tiendita<b>.com</b><span className="loc">ALTAMIRA</span></div>
   <button className="pill" onClick={()=>{if(need())setModal(vid?'m':'l')}}>Mi puesto</button></div>
   <div className="hh"><h1>El tianguis digital de Altamira</h1><p>Renta de mobiliario, fletes económicos y los mejores puestos de la zona, en un solo lugar.</p></div></div>
  <div className="w">
   {authErr&&<div className="err">No hay conexión con la base de datos ({authErr}). Revisa en Firebase que el acceso <b>Anónimo</b> esté activado y que este dominio esté en <b>Authorized domains</b>.</div>}
   <div className="svcs">{['sillas','fletes'].map(k=>{const S=SEC[k],items=P.filter(p=>p.sec===k)
    return <section className="svc" key={k}>
     {items.length?<div className="ph">{items.map(p=><div className="s" key={p.id}><img src={p.img} alt=""/>{p.title&&<div className="cap">{p.title}</div>}</div>)}</div>
      :<div className="empty">{S.e}<small>Promociones muy pronto</small></div>}
     <div className="bd"><h2>{S.t}</h2><p>{S.s}</p><button className="btn p" onClick={()=>setModal(k==='sillas'?'s':'f')}>{S.b}</button></div></section>})}</div>
   <div className="st"><h2 style={{margin:0}}>Tianguis</h2><span className="note">{V.length} puestos</span></div>
   <input className="search" placeholder="Buscar puesto o producto" value={q} onChange={e=>setQ(e.target.value)}/>
   <div className="chips"><button className={'chip'+(cat==='todos'?' on':'')} onClick={()=>setCat('todos')}>Todos</button>
    {CATS.map(c=><button key={c[0]} className={'chip'+(cat===c[0]?' on':'')} onClick={()=>setCat(c[0])}>{c[2]} {c[1]}</button>)}</div>
   <div className="grid">{L.map(v=>{const c=catOf(v.cat);return <div className="vc" key={v.id} onClick={()=>setSel(v)}>
    <div className="av">{v.products[0]?.e||(c?c[2]:'🏪')}</div><b>{v.name}</b>{c&&<span className="tag">{c[1]}</span>}<div className="note">{v.products.length} productos</div></div>})}</div>
   {!L.length&&<div className="note" style={{textAlign:'center',padding:24}}>{V.length?'No hay puestos en esta categoría.':'Aún no hay puestos.'}</div>}
   <footer>Tiendita punto com Altamira · Cotizaciones estimadas, se confirman por WhatsApp<br/><a href="#" onClick={e=>{e.preventDefault();if(need())setModal('a')}}>Administrador</a></footer>
  </div>
  {modal==='s'&&<Sillas onClose={()=>setModal(null)}/>}
  {modal==='f'&&<Fletes onClose={()=>setModal(null)}/>}
  {modal==='l'&&uid&&<VendorLogin uid={uid} onDone={ph=>{setVid(ph);setModal('m')}} onClose={()=>setModal(null)}/>}
  {modal==='m'&&mine&&<MiPuesto v={mine} uid={uid} onClose={()=>setModal(null)} onExit={()=>{setVid(null);setModal(null)}}/>}
  {modal==='m'&&!mine&&<Modal title="Mi puesto" onClose={()=>setModal(null)}><div className="note">Tu número no está dado de alta. Pídele al administrador que te registre.</div></Modal>}
  {modal==='a'&&uid&&<Admin uid={uid} isAdmin={isAdmin} setIsAdmin={setIsAdmin} V={V} P={P} onClose={()=>setModal(null)}/>}
  {sel&&<Puesto v={sel} onClose={()=>setSel(null)}/>}
 </>
}
createRoot(document.getElementById('root')).render(<App/>)
</script></body></html>
